name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Dependances
        run: |
          docker run --rm \
            -v "$PWD":/project \
            aquasec/trivy:latest fs \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            /project/requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Test Dockerfile (bonnes pratiques)
        run: |
          docker run --rm \
            -v "$PWD":/project \
            aquasec/trivy:latest config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            /project/Dockerfile

      - name: Construction de l'image
        run: |
          docker build -t breakableflask:${{ github.sha }} .

      - name: Scan de l'image avec Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            breakableflask:${{ github.sha }}

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
